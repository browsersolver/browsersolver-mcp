name: browsersolver
image: mcp/browsersolver
type: server
meta:
  category: web
  tags:
    - browsersolver
    - web-unlocker
    - web-scraping
    - headless-browser
    - antibot
about:
  title: BrowserSolver
  description: Unlock, render, crawl and screenshot any website — anti-bot bypass and technology detection through one API.
  icon: https://raw.githubusercontent.com/browsersolver/browsersolver-mcp/main/assets/icon-400.png
source:
  project: https://github.com/browsersolver/browsersolver-mcp
run:
  allowHosts:
    - api.browsersolver.com:443
config:
  description: Configure your BrowserSolver API key.
  secrets:
    - name: browsersolver.api_key
      env: BROWSERSOLVER_API_KEY
      example: YOUR_API_KEY
      description: Required API key from https://app.browsersolver.com.
      required: true
